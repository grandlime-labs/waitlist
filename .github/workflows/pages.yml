# Publishes the static waitlist page to GitHub Pages.
# Enable Pages once: Settings > Pages > Build and deployment > Source: GitHub Actions
# (or `gh api -X POST repos/<owner>/<repo>/pages -f build_type=workflow`).
name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - name: Stage site
        run: |
          mkdir _site
          cp index.html style.css _site/
          cp -R assets _site/assets
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
